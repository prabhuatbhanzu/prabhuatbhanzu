<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Engineering signature terminal">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DFFB5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3DFFB5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3DFFB5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#tbg)" stroke="#1E293B"/>
  <rect width="900" height="42" rx="18" fill="#0F172A"/>
  <rect y="24" width="900" height="18" fill="#0F172A"/>

  <g transform="translate(22,21)">
    <circle cx="0" cy="0" r="5" fill="#FF5F57"/>
    <circle cx="18" cy="0" r="5" fill="#FEBC2E"/>
    <circle cx="36" cy="0" r="5" fill="#28C840"/>
    <text x="60" y="4" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">prabhu — session</text>
  </g>

  <rect x="0" y="42" width="900" height="278" fill="url(#scan)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <text x="28" y="84" fill="#3DFFB5">$</text>
    <text x="48" y="84" fill="#E2E8F0">identity --brief</text>
    <text x="28" y="116" fill="#94A3B8">backend_engineer</text>
    <text x="28" y="140" fill="#94A3B8">product_builder</text>
    <text x="28" y="164" fill="#94A3B8">production_shipper</text>

    <text x="28" y="208" fill="#3DFFB5">$</text>
    <text x="48" y="208" fill="#E2E8F0">focus</text>
    <text x="28" y="240" fill="#5B8CFF">APIs · data · infra · shipping the UI when it matters</text>

    <text x="28" y="284" fill="#3DFFB5">$</text>
    <text x="48" y="284" fill="#E2E8F0">status</text>
    <text x="120" y="284" fill="#F8FAFC">building</text>
    <text x="200" y="284" fill="#3DFFB5">
      <tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>█
      </tspan>
    </text>
