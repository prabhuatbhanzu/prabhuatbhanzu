<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420" role="img" aria-label="Solve. Build. Ship." text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1520"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="move" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4DA3FF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#8AC2FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8AC2FF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="14s" repeatCount="indefinite" additive="sum"/>
    </linearGradient>
    <radialGradient id="orb" cx="82%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#163556" stop-opacity="1"/>
      <stop offset="100%" stop-color="#163556" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#243041" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1800" height="420" rx="24" fill="url(#bg)" stroke="#243041"/>
  <rect width="1800" height="420" rx="24" fill="url(#grid)" opacity="0.28"/>
  <rect width="1800" height="420" rx="24" fill="url(#orb)"/>
  <rect width="1800" height="420" rx="24" fill="url(#move)"/>
  <rect x="0" y="416" width="1800" height="4" fill="#4DA3FF" opacity="0.55"/>

  <g transform="translate(56,48)">
    <circle cx="0" cy="0" r="6" fill="#FF5F57"/>
