    <circle cx="44" cy="0" r="6" fill="#28C840"/>
    <text x="72" y="5" fill="#66768C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">prabhuatbhanzu</text>
  </g>

  <text x="56" y="130" fill="#4DA3FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="4">BACKEND · PRODUCT · PRODUCTION</text>
  <text x="56" y="210" fill="#F2F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700">Solve. Build. Ship.</text>
  <text x="56" y="262" fill="#93A1B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Backend Developer · Full-Stack Builder · Product Engineer</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">
    <rect x="56" y="304" width="170" height="48" rx="14" fill="#121A27" stroke="#243041"/>
    <text x="141" y="335" text-anchor="middle" fill="#F2F6FC">Bengaluru</text>
    <rect x="238" y="304" width="130" height="48" rx="14" fill="#121A27" stroke="#243041"/>
    <text x="303" y="335" text-anchor="middle" fill="#F2F6FC">Bhanzu</text>
    <rect x="380" y="304" width="180" height="48" rx="14" fill="#121A27" stroke="#243041"/>
    <text x="470" y="335" text-anchor="middle" fill="#4DA3FF">bhanzu.com</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">
    <rect x="980" y="304" width="760" height="48" rx="14" fill="#121A27" stroke="#243041"/>
    <text x="1010" y="335" fill="#66768C">flow</text>
