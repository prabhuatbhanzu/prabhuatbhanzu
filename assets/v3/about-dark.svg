<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="280" viewBox="0 0 1800 280" role="img" aria-label="About" text-rendering="geometricPrecision">
  <rect width="1800" height="280" rx="24" fill="#0E1520" stroke="#243041"/>
  <text x="56" y="64" fill="#F2F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700">About</text>
  <rect x="56" y="82" width="72" height="4" rx="2" fill="#4DA3FF"/>
  <text x="56" y="140" fill="#93A1B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">I ship backends for a living — and the UI when production starts arguing.</text>
  <text x="56" y="180" fill="#93A1B5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">APIs, data, cloud, and the awkward glue that turns demos into products.</text>
  <text x="56" y="232" fill="#F2F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="650">If it only works on my laptop, it doesn&apos;t count.</text>
</svg>