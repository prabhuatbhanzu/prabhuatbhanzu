<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Solve. Build. Ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#070F1C"/>
      <stop offset="100%" stop-color="#041016"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D9F5"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="orb1" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#122033" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity="0.45"/>
  <rect width="1200" height="420" fill="url(#orb1)"/>
  <rect width="1200" height="420" fill="url(#orb2)"/>
  <rect x="0" width="1200" height="2" fill="#00F5A0" opacity="0.35">
    <animate attributeName="y" values="0;420;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(44,34)">
    <circle cx="0" cy="0" r="6" fill="#FF5F57"/>
    <circle cx="22" cy="0" r="6" fill="#FEBC2E"/>
    <circle cx="44" cy="0" r="6" fill="#28C840"/>
    <text x="74" y="5" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">prabhuatbhanzu — production</text>
  </g>
  <text x="44" y="110" fill="#00F5A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4" filter="url(#glow)">BACKEND · PRODUCT · PRODUCTION</text>
  <text x="44" y="185" fill="url(#title)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800">Solve. Build. Ship.</text>
  <text x="44" y="235" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">I turn hard problems into software that reaches production.</text>
  <text x="44" y="275" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Backend Developer  ·  Full-Stack Builder  ·  Product Engineer</text>
  <g transform="translate(44,312)">
    <rect width="620" height="52" rx="16" fill="#0B1628" stroke="#1E3A4F"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" y="32">
      <tspan x="28" fill="#475569">$</tspan>
      <tspan dx="12" fill="#E2E8F0">pipeline</tspan>
      <tspan dx="24" fill="#00F5A0">IDEATE</tspan>
      <tspan dx="10" fill="#334155">→</tspan>
      <tspan dx="10" fill="#00D9F5">BUILD</tspan>
      <tspan dx="10" fill="#334155">→</tspan>
      <tspan dx="10" fill="#A5B4FC">SHIP</tspan>
      <tspan dx="10" fill="#334155">→</tspan>
      <tspan dx="10" fill="#7C5CFF">SCALE</tspan>
      <tspan dx="8" fill="#00F5A0"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>█</tspan>
    </text>
  </g>
  <rect x="0" y="416" width="1200" height="4" fill="url(#neon)"/>
</svg>
