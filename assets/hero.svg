<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Prabhu — Solve. Build. Ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3DFFB5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3DFFB5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2A3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DFFB5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3DFFB5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)" opacity="0.35"/>
  <circle cx="980" cy="80" r="160" fill="url(#orb)"/>
  <circle cx="180" cy="300" r="120" fill="url(#orb)" opacity="0.7"/>

  <g transform="translate(48,36)">
    <circle cx="0" cy="0" r="5" fill="#FF5F57"/>
    <circle cx="18" cy="0" r="5" fill="#FEBC2E"/>
    <circle cx="36" cy="0" r="5" fill="#28C840"/>
    <text x="64" y="5" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">~/prabhuatbhanzu</text>
  </g>

  <text x="48" y="120" fill="#3DFFB5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" letter-spacing="3">BACKEND · PRODUCT · PRODUCTION</text>

  <text x="48" y="178" fill="url(#title)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700">Solve. Build. Ship.</text>

  <text x="48" y="220" fill="#94A3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Backend Developer · Full-Stack Builder · Product Engineer</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <rect x="48" y="268" width="560" height="44" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="72" y="295" fill="#64748B">pipeline</text>
    <text x="160" y="295" fill="#E2E8F0">IDEATE</text>
    <text x="240" y="295" fill="#3DFFB5">→</text>
    <text x="268" y="295" fill="#E2E8F0">BUILD</text>
    <text x="340" y="295" fill="#3DFFB5">→</text>
    <text x="368" y="295" fill="#E2E8F0">SHIP</text>
    <text x="430" y="295" fill="#3DFFB5">→</text>
    <text x="458" y="295" fill="#5B8CFF">SCALE</text>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#glow)"/>
</svg>
