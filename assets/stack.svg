<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="Engineering stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/><stop offset="100%" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5A0"/><stop offset="100%" stop-color="#00D9F5"/>
    </linearGradient>
  </defs>
  <rect width="920" height="340" rx="20" fill="url(#bg)" stroke="#132033"/>
  <text x="36" y="40" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Systems I actually ship with</text>
  <text x="36" y="64" fill="#64748B" font-family="ui-monospace, Menlo, monospace" font-size="12">strength · not a laundry list</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <text x="36" y="110" fill="#94A3B8">Backend</text>
    <text x="160" y="110" fill="#CBD5E1">Python · Flask · FastAPI · Node · Java</text>
    <rect x="36" y="120" width="848" height="8" rx="4" fill="#111827"/>
    <rect x="36" y="120" width="780" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="0;780" dur="1.4s" fill="freeze"/></rect>
    <text x="36" y="165" fill="#94A3B8">Data</text>
    <text x="160" y="165" fill="#CBD5E1">PostgreSQL · DynamoDB · Redis · S3</text>
    <rect x="36" y="175" width="848" height="8" rx="4" fill="#111827"/>
    <rect x="36" y="175" width="720" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="0;720" dur="1.5s" fill="freeze"/></rect>
    <text x="36" y="220" fill="#94A3B8">Infra</text>
    <text x="160" y="220" fill="#CBD5E1">AWS Lambda/EKS · Docker · K8s · Argo CD · Terraform</text>
    <rect x="36" y="230" width="848" height="8" rx="4" fill="#111827"/>
    <rect x="36" y="230" width="760" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="0;760" dur="1.6s" fill="freeze"/></rect>
    <text x="36" y="275" fill="#94A3B8">Frontend</text>
    <text x="160" y="275" fill="#CBD5E1">TypeScript · React · Next.js · Tailwind</text>
    <rect x="36" y="285" width="848" height="8" rx="4" fill="#111827"/>
    <rect x="36" y="285" width="560" height="8" rx="4" fill="#7C5CFF"><animate attributeName="width" values="0;560" dur="1.7s" fill="freeze"/></rect>
  </g>
  <text x="36" y="322" fill="#475569" font-family="ui-monospace, Menlo, monospace" font-size="11">Observability: Datadog · Sentry   ·   Tools: Git · GitHub · Linux · Cursor</text>
</svg>
