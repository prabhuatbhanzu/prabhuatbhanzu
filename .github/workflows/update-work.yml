name: update-work-card

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/v3/work-dark.svg"
      - "assets/v3/work-light.svg"
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Work card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_GRAPHICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_work_card.py

      - name: Commit Work card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh work card [skip ci]"
          file_pattern: assets/v3/work-*.svg
